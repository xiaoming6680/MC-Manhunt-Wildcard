name: Fabric builds
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.21.11'
            project: '.'
            java: '21'
          - minecraft: '26.1'
            project: 'versions/26.1'
            java: '25'
          - minecraft: '26.1.1'
            project: 'versions/26.1'
            java: '25'
          - minecraft: '26.1.2'
            project: 'versions/26.1'
            java: '25'
          - minecraft: '26.2'
            project: 'versions/26.2'
            java: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the selected Minecraft target
        run: bash gradlew -p '${{ matrix.project }}' -Pminecraft_version='${{ matrix.minecraft }}' build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Manhunt-Wildcard-mc${{ matrix.minecraft }}
          path: ${{ matrix.project }}/build/libs/*.jar
          if-no-files-found: error
